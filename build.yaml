targets:
  $default:
    builders:
      discord:slash_commands:
        enabled: true
      discord:constants:
        enabled: true

builders:
  slash_commands:
    import: "package:discord/src/builders/slash_commands.dart"
    builder_factories:
      - commandBuilder
    build_extensions:
      .dart:
        - .discord.g.part
    auto_apply: root_package
    build_to: cache
    applies_builders:
      - source_gen:combining_builder

  constants:
    import: "package:discord/src/builders/constants_builders.dart"
    builder_factories:
      - constantsBuilder
    build_extensions:
      $lib$:
        - src/constants/generated_constants.dart
    auto_apply: none
    build_to: source
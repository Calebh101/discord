name: discord
description: A library for easily making a Discord bot with nyxx using slash commands.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.13.4

dependencies:
  localpkg:
    git:
      url: https://github.com/Calebh101/localpkg-dart
      ref: main

  nyxx: ^6.9.1
  analyzer: ^14.4.0
  build: ^4.0.11
  collection: ^1.19.1
  meta: ^1.19.0
  source_gen: ^4.3.0
  intl: ^0.20.3
  sqlite3: ^3.7.0
  system_info2: ^4.1.0
  http: ^1.6.0
  dart_style: ^3.0.0
  crypto: ^3.0.7
  retry: ^3.1.2
  path: ^1.9.1
  nyxx_extensions: ^4.4.0

dev_dependencies:
  build_runner: ^2.16.1
  lints: ^6.0.0
  test: ^1.25.6

  recursive_caster:
    git:
      url: https://github.com/Calebh101/dart-recursive-caster.git
      ref: main
